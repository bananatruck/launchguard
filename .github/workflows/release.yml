name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, for example v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries link musl statically. A glibc build made on the
          # newest runner refuses to start on any older distribution, which is
          # most of them; a static binary depends on no system libc at all.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          # Both macOS targets build on the Apple Silicon runner. The Intel one
          # cross-compiles, because the macos-13 Intel runner label is retired
          # and a job requesting it queues forever instead of failing.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # musl-tools supplies musl-gcc, which the bundled SQLite needs to compile.
      # Each Linux target builds on its own architecture, so this is a native
      # musl build rather than a C cross-compile.
      - name: Install musl toolchain
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      # Archive the binary and publish a checksum beside it. The install script
      # refuses to continue when the checksum does not match.
      # Checksums are produced from inside dist/ so the manifest names the
      # archive exactly as it is published. Building the line by hand invites
      # quoting bugs that only surface when someone tries to install.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="launchguard-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/launchguard" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )
          cat "dist/$name.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "launchguard-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/launchguard.exe" "dist/$name/"
          Copy-Item README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          # WriteAllText keeps LF endings; Out-File would emit CRLF and break a
          # manifest every other platform reads with plain text tools.
          [System.IO.File]::WriteAllText(
            "$PWD/dist/$name.zip.sha256", "$hash  $name.zip`n")
          Get-Content "dist/$name.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: launchguard-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cat dist/*.sha256 | tr -d '\r' > dist/SHA256SUMS
          echo "Published artifacts:"
          cat dist/SHA256SUMS

          # Every manifest line must name an archive that exists and hash it
          # correctly, so a release can never publish an unusable manifest.
          ( cd dist && sha256sum --check --strict SHA256SUMS )

          expected=5
          actual=$(wc -l < dist/SHA256SUMS)
          if [ "$actual" -ne "$expected" ]; then
            echo "expected $expected checksum lines, found $actual" >&2
            exit 1
          fi

      # Binaries are unsigned. Signing needs a paid Apple Developer Program
      # membership and a Windows code-signing certificate, both recorded in
      # docs/SYSTEM_REQUIREMENTS.md as costs outside the free contract.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "LaunchGuard $TAG" \
            --notes "Unsigned prebuilt binaries. Verify against \`SHA256SUMS\` before use.

          Install:

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
          \`\`\`

          Or download the archive for your platform, check its digest, and place \`launchguard\` on your PATH." \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS
