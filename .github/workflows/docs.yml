name: Documentation

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@v24.1.0
        with:
          globs: |
            README.md
            CONTRIBUTING.md
            docs/**/*.md

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --offline
            --include-fragments
            --no-progress
            README.md
            CONTRIBUTING.md
            'docs/**/*.md'
          fail: true
