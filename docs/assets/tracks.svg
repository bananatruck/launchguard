<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="Track A deploys with only the binary; Track B adds local verification with a container runtime">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14161d"/>
      <stop offset="100%" stop-color="#0c0e13"/>
    </linearGradient>
    <linearGradient id="tealWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a9d9c" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4a9d9c" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="slateWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a6b94" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#4a6b94" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="grain2" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soften2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <rect width="880" height="330" fill="url(#tbg)"/>
  <ellipse cx="700" cy="30" rx="220" ry="130" fill="#3d5a80" opacity="0.10" filter="url(#soften2)"/>

  <text x="44" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#e8e3d9" letter-spacing="0.4">Two delivery tracks</text>
  <text x="44" y="70" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#7d776d">providers build from source, so local execution verifies a deployment rather than producing one</text>

  <!-- Track A -->
  <g transform="translate(44,96)">
    <rect width="386" height="200" rx="6" fill="url(#tealWash)"/>
    <rect width="386" height="200" rx="6" fill="none" stroke="#2f4a49" stroke-width="1"/>
    <rect x="0" y="0" width="386" height="3" fill="#4a9d9c"/>
    <text x="24" y="38" font-family="Georgia, serif" font-size="16" fill="#e8e3d9">Track A · deploy</text>
    <text x="24" y="60" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#4a9d9c">requires the launchguard binary and nothing else</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#b9b3a8">
      <text x="24" y="90">detect  ·  scan  ·  plan  ·  target</text>
      <text x="24" y="112">generate configuration</text>
      <text x="24" y="134">open a reviewed pull request</text>
      <text x="24" y="156">provider builds  →  live URL</text>
    </g>
    <text x="24" y="182" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#6b665e">no runtime · no model · no Rust toolchain</text>
  </g>

  <!-- Track B -->
  <g transform="translate(450,96)">
    <rect width="386" height="200" rx="6" fill="url(#slateWash)"/>
    <rect width="386" height="200" rx="6" fill="none" stroke="#2c3a4d" stroke-width="1"/>
    <rect x="0" y="0" width="386" height="3" fill="#4a6b94"/>
    <text x="24" y="38" font-family="Georgia, serif" font-size="16" fill="#e8e3d9">Track B · verify</text>
    <text x="24" y="60" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#4a6b94">Track A plus a container runtime</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#b9b3a8">
      <text x="24" y="90">everything in Track A</text>
      <text x="24" y="112">build and test in a sandbox</text>
      <text x="24" y="134">health check before publication</text>
      <text x="24" y="156">higher readiness score</text>
    </g>
    <text x="24" y="182" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#6b665e">Podman preferred · Docker supported</text>
  </g>

  <text x="440" y="318" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#5d5951" text-anchor="middle">missing capability lowers the score and is recorded as a degradation — it never removes the path to a deployment</text>

  <rect width="880" height="330" filter="url(#grain2)" opacity="0.055"/>
</svg>
